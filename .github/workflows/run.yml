name: Update TVBox Config

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4

      - name: Clone upstream qist/tvbox
        run: |
          git clone --depth=1 https://github.com/qist/tvbox.git upstream

      - name: Sync tvbox files
        run: |
          rsync -av --delete upstream/ ./

      - name: Clean temp files
        run: |
          rm -rf upstream .git .github

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "自动同步 qist/tvbox 上游"
            git push
          else
            echo "没有变更，跳过提交"
          fi
